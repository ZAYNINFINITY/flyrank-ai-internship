name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    # Must stay exactly "ci" — branch protection on main requires this
    # status-check context before PRs can merge.
    name: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week-03/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: week-03/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright Chromium)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: week-03/app/playwright-report
          retention-days: 7

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Space Grotesk', system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="800" height="180" fill="#09090b"/>

  <!-- FlyRank wordmark -->
  <text x="400" y="52" text-anchor="middle" fill="#52525b" font-size="13" font-weight="500" letter-spacing="0.12em" text-transform="uppercase">
    FLYRANK AI INTERNSHIP
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
  </text>

  <!-- Thin line -->
  <line x1="340" y1="68" x2="460" y2="68" stroke="#27272a" stroke-width="1">
    <animate attributeName="x1" values="400;340" dur="0.6s" begin="0.3s" fill="freeze"/>
    <animate attributeName="x2" values="400;460" dur="0.6s" begin="0.3s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.3s" fill="freeze"/>
  </line>

  <!-- Main title -->
  <text x="400" y="108" text-anchor="middle" fill="#fafafa" font-size="32" font-weight="700" letter-spacing="-0.02em">
    flyrank-ai-internship
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.2s" fill="freeze"/>
    <animate attributeName="y" values="118;108" dur="0.6s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- Description -->
  <text x="400" y="140" text-anchor="middle" fill="#71717a" font-size="14" font-weight="400">
    Frontend AI Engineering · Self-paced · Built around real work
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.5s" fill="freeze"/>
  </text>

  <!-- Accent dot -->
  <circle cx="400" cy="162" r="2" fill="#2563eb">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
    <animate attributeName="r" values="0;2" dur="0.4s" begin="0.8s" fill="freeze"/>
  </circle>
</svg>

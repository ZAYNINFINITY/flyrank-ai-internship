<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180">
  <defs>
    <style>
      text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <rect width="800" height="180" fill="#09090b"/>

  <!-- FlyRank wordmark (hand-drawn, no external ref) -->
  <text x="400" y="38" text-anchor="middle" fill="#52525b" font-size="12" font-weight="600" letter-spacing="0.18em">
    FLYRANK
    <animate attributeName="opacity" values="0;0.6" dur="0.5s" fill="freeze"/>
  </text>

  <!-- Main title -->
  <text x="400" y="96" text-anchor="middle" fill="#fafafa" font-size="38" font-weight="700" letter-spacing="-0.02em">
    flyrank-ai-internship
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.15s" fill="freeze"/>
    <animate attributeName="y" values="106;96" dur="0.6s" begin="0.15s" fill="freeze"/>
  </text>

  <!-- Accent line -->
  <line x1="340" y1="116" x2="460" y2="116" stroke="#2563eb" stroke-width="1.5">
    <animate attributeName="x1" values="400;340" dur="0.5s" begin="0.4s" fill="freeze"/>
    <animate attributeName="x2" values="400;460" dur="0.5s" begin="0.4s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.4s" fill="freeze"/>
  </line>

  <!-- Description -->
  <text x="400" y="144" text-anchor="middle" fill="#71717a" font-size="15" font-weight="400" letter-spacing="0.01em">
    Frontend AI Engineering · Self-paced · Built around real work
    <animate attributeName="opacity" values="0;0.8" dur="0.8s" begin="0.6s" fill="freeze"/>
  </text>
</svg>

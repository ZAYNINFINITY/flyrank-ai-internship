<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Space Grotesk', system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="800" height="180" fill="#09090b"/>

  <!-- FlyRank wordmark -->
  <image x="320" y="16" width="160" height="24" href="https://internship.flyrank.ai/assets/flyrank-wordmark-onDark.svg" opacity="0.5">
    <animate attributeName="opacity" values="0;0.5" dur="0.6s" fill="freeze"/>
  </image>

  <!-- Main title -->
  <text x="400" y="92" text-anchor="middle" fill="#fafafa" font-size="40" font-weight="700" letter-spacing="-0.03em">
    flyrank-ai-internship
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.15s" fill="freeze"/>
    <animate attributeName="y" values="102;92" dur="0.6s" begin="0.15s" fill="freeze"/>
  </text>

  <!-- Accent line -->
  <line x1="340" y1="112" x2="460" y2="112" stroke="#2563eb" stroke-width="1.5">
    <animate attributeName="x1" values="400;340" dur="0.5s" begin="0.4s" fill="freeze"/>
    <animate attributeName="x2" values="400;460" dur="0.5s" begin="0.4s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.4s" fill="freeze"/>
  </line>

  <!-- Description -->
  <text x="400" y="140" text-anchor="middle" fill="#71717a" font-size="15" font-weight="400" letter-spacing="0.01em">
    Frontend AI Engineering · Self-paced · Built around real work
    <animate attributeName="opacity" values="0;0.8" dur="0.8s" begin="0.6s" fill="freeze"/>
  </text>
</svg>

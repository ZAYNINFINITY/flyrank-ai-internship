<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="800" height="100">
  <defs>
    <style>
      text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <rect width="800" height="100" fill="#09090b"/>

  <!-- Main title -->
  <text x="400" y="48" text-anchor="middle" fill="#fafafa" font-size="38" font-weight="700" letter-spacing="-0.02em">
    flyrank-ai-internship
    <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze"/>
    <animate attributeName="y" values="58;48" dur="0.6s" fill="freeze"/>
  </text>

  <!-- Accent line -->
  <line x1="340" y1="68" x2="460" y2="68" stroke="#2563eb" stroke-width="1.5">
    <animate attributeName="x1" values="400;340" dur="0.5s" begin="0.3s" fill="freeze"/>
    <animate attributeName="x2" values="400;460" dur="0.5s" begin="0.3s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.3s" fill="freeze"/>
  </line>

  <!-- Description -->
  <text x="400" y="92" text-anchor="middle" fill="#71717a" font-size="15" font-weight="400" letter-spacing="0.01em">
    Frontend AI Engineering · Self-paced · Built around real work
    <animate attributeName="opacity" values="0;0.8" dur="0.8s" begin="0.5s" fill="freeze"/>
  </text>
</svg>
